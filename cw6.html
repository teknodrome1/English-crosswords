<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Crossword number 6</title>

  <style>
    :root { --cell: 40px; --border: #111; }

    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 18px;
      color: #111;
      background: #eaf7ea; /* soft light green */
    }

    h1 { margin: 0 0 8px; font-size: 34px; }

    .instructions {
      margin: 0 0 14px;
      font-size: 14px;
      line-height: 1.35;
    }

    .layout {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 20px;
      align-items: start;
    }

    /* Responsive: on small screens put clues below */
    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(15, var(--cell));
      grid-template-rows: repeat(15, var(--cell));
      user-select: none;
      border: 0;
      background: transparent;
    }

    .cell {
      position: relative;
      width: var(--cell);
      height: var(--cell);
      border: 1px solid var(--border);
      box-sizing: border-box;
      background: #fff;
    }

    .cell.block { background: #000; }

    .num {
      position: absolute;
      top: 2px;
      left: 3px;
      font-size: 10px;
      font-weight: normal;
      line-height: 1;
      color: #111;
      pointer-events: none;
    }

    .ch {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 18px;
      color: #111;
      pointer-events: none;
    }

    .ch.wrong-letter { color: #c1121f; } /* red for wrong letters */

    .cell.selected {
      outline: 3px solid #3b82f6;
      outline-offset: -3px;
    }

    .cell.in-word { background: #eef6ff; }

    .cell.block.selected,
    .cell.block.in-word {
      outline: none;
      background: #000;
    }

    /* Blink feedback (word highlight) */
    @keyframes blinkGreen { 0%,100%{ background:#e8fff0; } 50%{ background:#9ef0b7; } }
    @keyframes blinkRed   { 0%,100%{ background:#ffecec; } 50%{ background:#ff9a9a; } }

    .blink-green { animation: blinkGreen 420ms ease-in-out 0s 2; }
    .blink-red   { animation: blinkRed   420ms ease-in-out 0s 2; }

    /* Clues */
    .panel h2 { margin: 0 0 10px; font-size: 18px; }
    .panel h3 { margin: 14px 0 6px; font-size: 15px; }

    .clues {
      columns: 2;
      column-gap: 18px;
    }

    @media (max-width: 980px) {
      .clues { columns: 1; }
    }

    .clue {
      break-inside: avoid;
      margin: 0 0 7px;
      font-size: 13px;
      line-height: 1.25;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin: 0 0 12px;
    }

    button {
      padding: 7px 10px;
      border: 1px solid #bbb;
      background: #fff;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background: #f4f4f4; }

    .status { font-size: 13px; color: #333; }

    /* Hidden input for mobile keyboard reliability */
    input.hidden {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      opacity: 0;
    }
  </style>
</head>

<body>
  <h1>Crossword #6 - February 2026</h1>

  <p class="instructions">
    Click once to select words <b>ACROSS</b>, click a second time on the square to select the words <b>DOWN</b>.
  </p>

  <p class="instructions">
    Inspired for educational purposes by Fleming, puzzle 6.
  </p>

  <p class="instructions">
    Good luck!
  </p>

  <div class="toolbar">
    <button id="toggleDir">Direction: <b id="dirLabel">ACROSS</b></button>
    <button id="checkWord">Check word</button>
    <button id="clearWord">Clear word</button>
    <span class="status" id="status"></span>
  </div>

  <div class="layout">
    <div>
      <div id="grid" class="grid" aria-label="Crossword grid"></div>
      <input id="kbd" class="hidden" inputmode="latin" autocomplete="off" autocapitalize="characters" />
    </div>

    <div class="panel">
      <h2>Clues</h2>

      <h3>Across</h3>
      <div class="clues" id="acrossClues"></div>

      <h3>Down</h3>
      <div class="clues" id="downClues"></div>
    </div>
  </div>

<script>
/* SOLUTION GRID (Crossword #6 exact 15x15) */
const SOLUTION_ROWS = [
  "ARRAY#AREA#AWE#",
  "GEESE#WANT#NEAT",
  "OASIS#HIDE#CAGE",
  "#RED#PIN##SEVEN",
  "##METAL#CLOSER#",
  "JOB#AGE#LENT###",
  "UNLIKE#MUG#ODOR",
  "SCENE#PIE#DRIVE",
  "TEST#BOX#MASSES",
  "###EVER#SAT#ANT",
  "#STREET#CREEP##",
  "SWEPT##OAK#APT#",
  "HEAR#DIAL#BREAD",
  "ELSE#ACRE#ITALY",
  "#LET#MESS#THREE",
];

/* ACROSS CLUES (by number) */
const ACROSS_CLUES = {
  1:  "Data structure often indexed from zero",
  6:  "Measure of a region inside a boundary",
  10: "Feeling of reverential wonder",

  13: "Migratory honkers in a V formation",
  14: "Desire; be in need of",
  15: "Trim; tidy-looking",

  17: "Fertile spot in an otherwise arid landscape",
  18: "Conceal from view",
  19: "Enclosure for an animal (or a fighter)",

  20: "Color associated with stop signs",
  21: "Attach with a slender fastener",
  22: "One more than half a dozen",

  23: "Material prized for conductivity and strength",
  25: "Less distant, in space or relationship",

  27: "Paid position; line of work",
  29: "Years lived (or matured state)",
  30: "Provided as a temporary loan",

  31: "Not the same as; in contrast to",
  33: "Cup used at a diner, often with a handle",
  34: "Smell, especially an unpleasant one",

  38: "Segment of a play or movie",
  39: "Classic dessert with a crust, often served in slices",
  40: "Operate a vehicle; propel",

  41: "Exam to assess knowledge or performance",
  42: "Container with a lid, often rectangular",
  43: "Large quantities; multitudes",

  44: "At any time; on any occasion",
  46: "Day of the week before Sunday (abbr.)",
  47: "Small hardworking insect",

  48: "Public road in a city or town",
  50: "Move stealthily or in a menacing way",

  52: "Cleaned thoroughly with a broom",
  53: "Sturdy tree that yields acorns",
  54: "Short for an apartment listing",

  56: "Perceive sound with the ears",
  57: "Rotary control on a radio, clock, or safe",
  59: "Staple food made from flour and yeast",

  61: "Otherwise; if not",
  62: "43,560 square feet",
  63: "Boot-shaped European country",

  64: "Permit; allow",
  65: "Disorder; untidiness",
  66: "The number after two",
};

/* DOWN CLUES (list of [number, answer, clue]) */
const DOWN_LIST = [
  [1,  "AGO",         "Did something some time back"],
  [2,  "REAR",        "Back part of a ship; opposite of bow"],
  [3,  "RESEMBLES",   "Looks like; is similar in appearance to"],
  [4,  "ASIDE",       "Off to one side"],
  [5,  "YES",         "Affirmative response"],

  [6,  "AWHILE",      "For a short time; briefly"],
  [7,  "RAIN",        "Falls from clouds, often with thunder nearby"],
  [8,  "END",         "Finish; bring to a close"],
  [9,  "ATE",         "Consumed food"],

  [10, "ANCESTORS",   "People from whom one is descended"],
  [11, "WEAVE",       "Interlace threads to make fabric"],
  [12, "EAGER",       "Enthusiastic to begin; keen"],

  [16, "TEN",         "The number that follows nine"],

  [21, "PAGE",        "Sheet of paper in a book or document"],
  [22, "SON",         "Male child"],
  [24, "TAKE",        "Grasp and carry away"],

  [25, "CLUE",        "Hint in a puzzle"],
  [26, "LEG",         "Body part between knee and ankle"],

  [27, "JUST",        "Merely; only"],
  [28, "ONCE",        "At some time in the past"],

  [32, "INTERPRET",   "Explain the meaning of"],
  [33, "MIX",         "Combine ingredients until uniform"],

  [35, "DISAPPEAR",   "Vanish from sight"],
  [36, "OVEN",        "Appliance used for baking"],
  [37, "REST",        "Relax after exertion"],

  [39, "PORT",        "Harbor facility for ships"],
  [40, "DATE",        "Go out with romantically"],

  [42, "BEE",         "Pollinating insect that makes honey"],
  [43, "MARK",        "Sign or indicate"],
  [45, "VET",         "Animal doctor (abbr.)"],

  [46, "SCALES",      "Compare weight using a balance"],
  [48, "SWELL",       "Bulge outward; increase in size"],
  [49, "TEASE",       "Gently provoke or taunt playfully"],

  [51, "EARTH",       "Our planet (or “the world”)"],
  [52, "SHE",         "Female pronoun"],

  [53, "OARS",        "Implements used to row a boat"],
  [55, "TALE",        "Story; narrative"],

  [57, "DAM",         "Female parent"],
  [58, "ICE",         "Frozen water"],

  [59, "BIT",         "Small insect or tiny piece"],
  [60, "DYE",         "Color something with pigment"],
];

const H = 15, W = 15;
const gridEl = document.getElementById("grid");
const kbd = document.getElementById("kbd");
const statusEl = document.getElementById("status");

const isBlock = (r,c) => SOLUTION_ROWS[r][c] === "#";
const sol = (r,c) => SOLUTION_ROWS[r][c];
const user = Array.from({length:H}, () => Array.from({length:W}, () => ""));

let dir = "across";
let selected = {r:0,c:0};

const cellEls = Array.from({length:H}, () => Array.from({length:W}, () => null));

/* compute numbering */
const nums = Array.from({length:H}, () => Array.from({length:W}, () => null));
(function computeNumbers(){
  let n = 1;
  for (let r=0;r<H;r++){
    for (let c=0;c<W;c++){
      if (isBlock(r,c)) continue;
      const startAcross = (c===0 || isBlock(r,c-1)) && (c+1<W && !isBlock(r,c+1));
      const startDown   = (r===0 || isBlock(r-1,c)) && (r+1<H && !isBlock(r+1,c));
      if (startAcross || startDown) nums[r][c] = n++;
    }
  }
})();

function firstOpenCell(){
  for (let r=0;r<H;r++){
    for (let c=0;c<W;c++){
      if (!isBlock(r,c)) return {r,c};
    }
  }
  return {r:0,c:0};
}
selected = firstOpenCell();

function renderGrid(){
  gridEl.innerHTML = "";
  for (let r=0;r<H;r++){
    for (let c=0;c<W;c++){
      const d = document.createElement("div");
      d.className = "cell" + (isBlock(r,c) ? " block" : "");
      d.dataset.r = r; d.dataset.c = c;

      if (!isBlock(r,c) && nums[r][c] != null){
        const n = document.createElement("div");
        n.className = "num";
        n.textContent = nums[r][c];
        d.appendChild(n);
      }

      if (!isBlock(r,c)){
        const ch = document.createElement("div");
        ch.className = "ch";
        ch.textContent = user[r][c];
        d.appendChild(ch);
      }

      d.addEventListener("mousedown", (e)=>{
        e.preventDefault();

        if (selected.r === r && selected.c === c) {
          toggleDirInternal();
        } else {
          selectCell(r,c);
        }

        kbd.focus();
      });

      gridEl.appendChild(d);
      cellEls[r][c] = d;
    }
  }
  paintSelection();
}

function setStatus(msg){ statusEl.textContent = msg || ""; }

function setDir(newDir){
  dir = newDir;
  document.getElementById("dirLabel").textContent = dir.toUpperCase();
  paintSelection();
}

function toggleDirInternal(){
  setDir(dir === "across" ? "down" : "across");
}

document.getElementById("toggleDir").addEventListener("click", ()=>{
  toggleDirInternal();
  kbd.focus();
});
document.getElementById("checkWord").addEventListener("click", ()=>{
  checkCurrentWord(true);
  kbd.focus();
});
document.getElementById("clearWord").addEventListener("click", ()=>{
  clearCurrentWord();
  kbd.focus();
});

function selectCell(r,c){
  if (isBlock(r,c)) return;
  selected = {r,c};
  paintSelection();
}

function getWordCells(r,c,dir){
  let sr=r, sc=c;
  if (dir==="across"){
    while (sc>0 && !isBlock(sr, sc-1)) sc--;
    const cells=[];
    while (sc<W && !isBlock(sr, sc)) { cells.push({r:sr,c:sc}); sc++; }
    return cells;
  } else {
    while (sr>0 && !isBlock(sr-1, sc)) sr--;
    const cells=[];
    while (sr<H && !isBlock(sr, sc)) { cells.push({r:sr,c:sc}); sr++; }
    return cells;
  }
}

function paintSelection(){
  for (let r=0;r<H;r++){
    for (let c=0;c<W;c++){
      const el = cellEls[r][c];
      if (!el) continue;
      el.classList.remove("selected","in-word");
    }
  }

  const word = getWordCells(selected.r, selected.c, dir);
  for (const p of word) cellEls[p.r][p.c].classList.add("in-word");
  cellEls[selected.r][selected.c].classList.add("selected");

  const wStart = word[0];
  const n = nums[wStart.r][wStart.c];
  if (n != null){
    const clue = (dir==="across")
      ? (ACROSS_CLUES[n] || "")
      : (DOWN_LIST.find(x=>x[0]===n)?.[2] || "");
    setStatus(dir.toUpperCase() + " " + n + ": " + clue);
  } else {
    setStatus("");
  }
}

function move(deltaR, deltaC){
  let r=selected.r, c=selected.c;
  while (true){
    r += deltaR; c += deltaC;
    if (r<0||r>=H||c<0||c>=W) return;
    if (!isBlock(r,c)) { selectCell(r,c); return; }
  }
}

function nextCell(){ (dir==="across") ? move(0,1) : move(1,0); }
function prevCell(){ (dir==="across") ? move(0,-1) : move(-1,0); }

function setLetterAt(r,c,letter){
  user[r][c] = letter;
  const ch = cellEls[r][c].querySelector(".ch");
  if (ch) {
    ch.textContent = letter;

    if (letter && letter.toUpperCase() !== sol(r,c).toUpperCase()) ch.classList.add("wrong-letter");
    else ch.classList.remove("wrong-letter");
  }
}

function blinkCells(cells, color){
  const cls = (color==="green") ? "blink-green" : "blink-red";
  for (const p of cells){
    const el = cellEls[p.r][p.c];
    el.classList.remove("blink-green","blink-red");
    void el.offsetWidth;
    el.classList.add(cls);
    el.addEventListener("animationend", ()=>el.classList.remove(cls), {once:true});
  }
}

function checkWordCells(cells, withBlink){
  const userWord = cells.map(p => (user[p.r][p.c] || "")).join("");
  const solWord  = cells.map(p => sol(p.r,p.c)).join("");

  if ([...userWord].some(ch => !ch)) return null;

  const ok = userWord.toUpperCase() === solWord.toUpperCase();
  if (withBlink) blinkCells(cells, ok ? "green" : "red");
  return ok;
}

function checkCurrentWord(withBlink){
  const cells = getWordCells(selected.r, selected.c, dir);
  const ok = checkWordCells(cells, withBlink);
  if (ok === null) { setStatus("Fill the entire word to check."); return false; }
  setStatus(ok ? "Correct." : "Not correct yet.");
  return ok;
}

function clearCurrentWord(){
  const cells = getWordCells(selected.r, selected.c, dir);
  for (const p of cells) setLetterAt(p.r,p.c,"");
  setStatus("Cleared word.");
}

function handleChar(ch){
  if (!/^[A-Za-z]$/.test(ch)) return;

  const activeWordCells = getWordCells(selected.r, selected.c, dir);

  setLetterAt(selected.r, selected.c, ch.toUpperCase());

  const complete = activeWordCells.every(p => user[p.r][p.c]);

  nextCell();

  if (complete) {
    checkWordCells(activeWordCells, true);
  }
}

document.addEventListener("keydown", (e)=>{
  const key = e.key;

  if (key === "Tab") { e.preventDefault(); toggleDirInternal(); return; }

  if (key === "ArrowUp")    { e.preventDefault(); move(-1,0); return; }
  if (key === "ArrowDown")  { e.preventDefault(); move(1,0);  return; }
  if (key === "ArrowLeft")  { e.preventDefault(); move(0,-1); return; }
  if (key === "ArrowRight") { e.preventDefault(); move(0,1);  return; }

  if (key === "Backspace") {
    e.preventDefault();
    if (user[selected.r][selected.c]) {
      setLetterAt(selected.r, selected.c, "");
    } else {
      prevCell();
      setLetterAt(selected.r, selected.c, "");
    }
    return;
  }

  if (key === "Enter") {
    e.preventDefault();
    checkCurrentWord(true);
    return;
  }

  if (key.length === 1) {
    e.preventDefault();
    handleChar(key);
  }
});

/* Render clue lists */
function renderClues(){
  const acrossEl = document.getElementById("acrossClues");
  const downEl = document.getElementById("downClues");

  const acrossNums = Object.keys(ACROSS_CLUES).map(n=>parseInt(n,10)).sort((a,b)=>a-b);
  acrossEl.innerHTML = acrossNums
    .map(n => '<div class="clue"><b>' + n + '.</b> ' + ACROSS_CLUES[n] + '</div>')
    .join("");

  downEl.innerHTML = DOWN_LIST
    .slice()
    .sort((a,b)=>a[0]-b[0])
    .map(([n,_ans,clue]) => '<div class="clue"><b>' + n + '.</b> ' + clue + '</div>')
    .join("");
}

/* Init */
renderGrid();
renderClues();

/* Click on grid focuses keyboard (helps mobile) */
gridEl.addEventListener("click", ()=>kbd.focus());
</script>

</body>
</html>
